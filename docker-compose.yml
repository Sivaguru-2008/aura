# AURA — single-host deployment.
#
#   docker compose up -d --build                      start (SQLite case store)
#   docker compose --profile postgres up -d --build   start with PostgreSQL
#   docker compose logs -f aura                       follow
#   docker compose run --rm aura preflight            diagnose a bad deploy
#
# Read docs/HOSPITAL_IT_INSTALL.md before putting this on a hospital network.
#
# The `version:` key is obsolete in Compose v2 and emits a warning on every
# invocation, so it is gone.

services:
  aura:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Set to 1 to build without the 86 MB brain checkpoint (chest-only image).
        AURA_SKIP_BRAIN: "${AURA_SKIP_BRAIN:-0}"
        # Optional: base URL of a release that serves the model_export file names.
        AURA_MODELS_URL: "${AURA_MODELS_URL:-}"
    image: aura:local
    container_name: aura-copilot

    ports:
      - "${AURA_PORT:-8000}:8000"
      - "${AURA_DICOM_PORT:-11112}:11112"

    environment:
      PORT: "8000"
      HOST: "0.0.0.0"
      # strict  -> a failed preflight check stops the container (default)
      # warn    -> report problems, start anyway
      # skip    -> do not check
      AURA_PREFLIGHT: "${AURA_PREFLIGHT:-strict}"
      AURA_SKIP_BRAIN: "${AURA_SKIP_BRAIN:-0}"
      AURA_LOG_LEVEL: "${AURA_LOG_LEVEL:-info}"
      # Deliberately NOT set to 1. The numpy fallback vision model exists for
      # dev and tests; with it enabled a container whose DenseNet weights failed
      # to load serves fabricated findings and still reports healthy.
      AURA_ALLOW_FALLBACK_VISION: "0"
      # Access control. With no token the API answers only requests that start
      # inside this container, which in practice is nothing but the healthcheck:
      # a browser reaches the container through Docker's network, not loopback,
      # and gets a 403 saying to set a token. Set one in .env:
      #   python -c "import secrets;print(secrets.token_urlsafe(32))"
      # Browsers then sign in once (name + token) and get a session cookie; scripts
      # send the token as `x-aura-token` plus `x-aura-user`.
      AURA_AUTH_TOKEN: "${AURA_AUTH_TOKEN:-}"
      AURA_AUTH_HEADER: "${AURA_AUTH_HEADER:-x-aura-token}"
      AURA_SESSION_TTL_HOURS: "${AURA_SESSION_TTL_HOURS:-12}"
      # 1 = serve the network with no token. Isolated demo networks only;
      # preflight warns on every boot while it is set.
      AURA_ALLOW_OPEN_ACCESS: "${AURA_ALLOW_OPEN_ACCESS:-0}"
      # Per-principal req/min; 0 = unlimited. In-process bucket, so N replicas
      # means an effective ceiling of N x this value.
      AURA_RATE_LIMIT_RPM: "${AURA_RATE_LIMIT_RPM:-0}"
      OMP_NUM_THREADS: "${AURA_THREADS:-4}"
      # The hospital/site this server belongs to. The first start stamps it into
      # the database; a server with a different AURA_SITE_ID then refuses to open it.
      AURA_SITE_ID: "${AURA_SITE_ID:-}"
      # The first administrator account, created once while no account exists. Set it
      # for the first start only, then remove it (docs/HOSPITAL_IT_INSTALL.md §5).
      AURA_BOOTSTRAP_ADMIN_PASSWORD: "${AURA_BOOTSTRAP_ADMIN_PASSWORD:-}"
      AURA_BOOTSTRAP_ADMIN_USER: "${AURA_BOOTSTRAP_ADMIN_USER:-}"
      # SQLite case store on the mounted volume below: the default. The previous
      # compose file set AURA_DATA_DIR, which nothing in the codebase reads, so the
      # store stayed inside the image layer and every restart discarded the worklist.
      AURA_DB_PATH: "/var/lib/aura/aura.db"
      # PostgreSQL instead: start with `--profile postgres` and set in .env
      #   AURA_PG_PASSWORD=<long random password>
      #   AURA_DATABASE_URL=postgresql+psycopg://aura:<same password>@postgres:5432/aura
      # Empty = SQLite. The local EHR fixture and embedding cache stay on the volume.
      AURA_DATABASE_URL: "${AURA_DATABASE_URL:-}"

    # Deliberately NOT listed above: AURA_FUSION_BACKEND. Left unset, the container
    # serves exactly what [tool.aura] in aura/pyproject.toml selects ("classical"
    # since 2026-09-12), same as a local run. To override, export it on the host and
    # add `AURA_FUSION_BACKEND: "${AURA_FUSION_BACKEND}"` above.

    # Only waits when the postgres profile is active; without it this is skipped.
    depends_on:
      postgres:
        condition: service_healthy
        required: false

    volumes:
      # Named volume, not a bind mount onto aura/artifacts: mounting over that
      # directory would shadow the baked-in weights and calibration files.
      - aura-state:/var/lib/aura

    restart: unless-stopped
    stop_grace_period: 30s

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      # Cold start loads DenseNet-121 + the BraTS checkpoint through torch on CPU;
      # 90s keeps a slow first boot from being restart-looped as "unhealthy".
      start_period: 90s
      retries: 3

    deploy:
      resources:
        limits:
          # torch on CPU with a 3D BraTS model is memory-hungry; below ~4 GB the
          # first brain study OOM-kills the container mid-request.
          memory: ${AURA_MEM_LIMIT:-6g}

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    container_name: aura-postgres
    environment:
      POSTGRES_DB: aura
      POSTGRES_USER: aura
      # No default on purpose: the image refuses to initialise without a password,
      # which is the right failure for a database that will hold patient records.
      POSTGRES_PASSWORD: "${AURA_PG_PASSWORD:-}"
    volumes:
      - aura-pg:/var/lib/postgresql/data
    # Not published to the host: only the aura service reaches it, over the compose
    # network. Publish 5432 deliberately if a backup job on the host needs it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura -d aura"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  aura-state:
  aura-pg:
