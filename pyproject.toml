[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aura"
version = "0.1.0"
description = "AURA: Clinical Copilot & Forensic Reproducibility Audit Harness for Medical AI"
authors = [
    {name = "Sivaguru Murugan", email = "sivagurumurugan1@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pennylane>=0.35",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "jinja2>=3.1",
    "pillow>=10.0",
    "matplotlib>=3.7",
    "python-multipart>=0.0.9",
    "SQLAlchemy>=2.0",
    "aiosqlite>=0.19",
    "httpx>=0.27",
    "pytest>=8.0",
    "nibabel>=5.2.0",
]

[project.optional-dependencies]
ibm = ["qiskit>=1.0", "qiskit-ibm-runtime>=0.20"]
braket = ["amazon-braket-sdk>=1.70", "boto3>=1.30"]
vectordb = ["qdrant-client>=1.7"]
pacs = ["pynetdicom>=2.0", "pydicom>=2.4"]
security = ["PyJWT>=2.8", "cryptography>=42.0"]
monitoring = ["psutil>=5.9", "prometheus-client>=0.20"]
postgres = ["psycopg[binary]>=3.2,<4"]
all = [
    "qiskit>=1.0", "qiskit-ibm-runtime>=0.20",
    "amazon-braket-sdk>=1.70", "boto3>=1.30",
    "qdrant-client>=1.7",
    "pynetdicom>=2.0", "pydicom>=2.4",
    "PyJWT>=2.8", "cryptography>=42.0",
    "psutil>=5.9", "prometheus-client>=0.20",
    "psycopg[binary]>=3.2,<4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aura*"]

[tool.pytest.ini_options]
pythonpath = [".", "aura"]
testpaths = ["aura/tests"]
addopts = "-q"
markers = [
    "slow: batch validation over the real image corpora (deselect with -m 'not slow')",
]
asyncio_mode = "strict"
filterwarnings = [
    "error::pytest.PytestUnknownMarkWarning",
]

[tool.aura]
fusion_backend = "classical"
abstention_conformal_size = 4
ood_energy_threshold = 1.5
low_confidence_threshold = 0.30
neuro_qkl_enabled = true
